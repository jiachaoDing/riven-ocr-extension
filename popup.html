<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riven OCR</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-main: #ffffff;
        --bg-secondary: #f3f4f6;
        --text-main: #111827;
        --text-secondary: #4b5563;
        --border: #e5e7eb;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --radius: 12px;
      }

      [data-theme='dark'] {
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --bg-main: #111827;
        --bg-secondary: #1f2937;
        --text-main: #f9fafb;
        --text-secondary: #9ca3af;
        --border: #374151;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      }

      * {
        box-sizing: border-box;
        transition: background-color 0.2s, color 0.2s, border-color 0.2s;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        width: 360px;
        min-height: 480px;
        display: flex;
        flex-direction: column;
      }

      /* Header & Navigation */
      header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        background: var(--bg-main);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .logo-group h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .nav-actions {
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        background: none;
        border: none;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        background: var(--bg-secondary);
        color: var(--text-main);
      }

      /* Main Content Area */
      main {
        padding: 16px;
        flex: 1;
        overflow-y: auto;
      }

      .view {
        display: none;
        animation: fadeIn 0.2s ease-out;
      }

      .view.active {
        display: block;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Drop Area */
      #drop-area {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 32px 16px;
        text-align: center;
        cursor: pointer;
        background: var(--bg-secondary);
        color: var(--text-secondary);
        margin-bottom: 16px;
      }

      #drop-area:hover {
        border-color: var(--primary);
        background: var(--bg-main);
      }

      #drop-area svg {
        margin-bottom: 12px;
        color: var(--primary);
      }

      /* Status & Buttons */
      #status {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 16px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--bg-secondary);
      }

      .btn-primary {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Result Area */
      #result-area {
        margin-top: 16px;
      }

      .result-card {
        background: var(--bg-secondary);
        border-radius: var(--radius);
        padding: 16px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      /* Settings View Styles */
      .settings-group {
        margin-bottom: 24px;
      }

      .settings-group h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin-bottom: 12px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }

      .setting-item {
        margin-bottom: 16px;
      }

      .setting-item label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
        font-weight: 500;
      }

      input[type="url"], input[type="text"], select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-main);
        color: var(--text-main);
        font-size: 14px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        padding: 8px 0;
      }

      .checkbox-item input {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-top: 8px;
      }

      .status-badge.success { background: #dcfce7; color: #166534; }
      .status-badge.error { background: #fee2e2; color: #991b1b; }
      .status-badge.info { background: #dbeafe; color: #1e40af; }

      [data-theme='dark'] .status-badge.success { background: #064e3b; color: #a7f3d0; }
      [data-theme='dark'] .status-badge.error { background: #7f1d1d; color: #fecaca; }
      [data-theme='dark'] .status-badge.info { background: #1e3a8a; color: #bfdbfe; }

      /* Footer */
      footer {
        padding: 12px;
        text-align: center;
        font-size: 11px;
        color: var(--text-secondary);
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-group">
        <h1>Riven OCR</h1>
        <a href="https://warframe.market/zh-hans/auctions" target="_blank" class="icon-btn" title="前往拍卖会" style="text-decoration: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" title="切换主题">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-sun"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="view-toggle" class="icon-btn" title="设置">
          <svg id="settings-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <svg id="back-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- Main OCR View -->
      <div id="main-view" class="view active">
        <div id="drop-area">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          <div style="font-weight: 500;">拖拽图片或点击选择</div>
          <div style="font-size: 12px; margin-top: 4px; opacity: 0.8;">支持 Ctrl+V 粘贴截图</div>
          <input id="file-input" type="file" accept="image/*" style="display: none" />
        </div>

        <div id="preview-container" style="display: none; margin-bottom: 16px;">
          <div style="position: relative; width: 100%; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow);">
            <img id="image-preview" src="" style="width: 100%; display: block; max-height: 240px; object-fit: contain; background: var(--bg-secondary);" />
            <button id="remove-preview" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 24px; height: 24px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
        
        <div id="status">准备就绪，请上传紫卡截图</div>
        
        <div class="actions" style="display: flex; flex-direction: column; gap: 8px;">
          <button id="fill-button" class="btn-primary" disabled>识别并解析图片</button>
        </div>
        
        <div id="result-area"></div>
      </div>

      <!-- Settings View -->
      <div id="settings-view" class="view">
        <div class="settings-group">
          <h2>后端服务</h2>
          <div class="setting-item">
            <label for="backend-url">OCR 后端 URL</label>
            <input type="url" id="backend-url" placeholder="http://127.0.0.1:80" />
            <div id="backend-status" class="status-badge info">检查中...</div>
          </div>
          <div class="setting-item">
            <label for="market-price-url">市场价格接口域名</label>
            <input type="url" id="market-price-url" placeholder="https://lab.webutilitykit.com" />
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="test-backend" style="flex: 1; padding: 8px; font-size: 12px; cursor: pointer;">测试连接</button>
            <button id="save-backend" style="flex: 1; padding: 8px; font-size: 12px; cursor: pointer;">保存</button>
          </div>
        </div>

        <div class="settings-group">
          <h2>字典管理</h2>
          <div class="setting-item">
            <div style="font-size: 13px; margin-bottom: 4px;">当前版本: <span id="dict-version" style="font-weight: 600;">-</span></div>
            <div id="dict-status" class="status-badge info">等待中</div>
          </div>
          <button id="update-dict" style="width: 100%; padding: 8px; font-size: 12px; cursor: pointer;">更新字典数据</button>
        </div>

        <div class="settings-group">
          <h2>自动化</h2>
          <label class="checkbox-item">
            <input type="checkbox" id="auto-fill-rows" />
            <span>自动补满正面词条行数</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="auto-open-modal" />
            <span>自动打开拍卖模态框</span>
          </label>
          <button id="save-settings" class="btn-primary" style="margin-top: 12px;">应用所有设置</button>
        </div>
      </div>
    </main>
    <div style="margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-secondary); font-size: 12px;">
        <p>如有侵权或建议，请联系作者：<a href="mailto:yinb9933@gmail.com" style="color: var(--primary); text-decoration: none;">yinb9933@gmail.com</a></p>
      </div>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
