<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Riven OCR</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: #111827;
        color: #e5e7eb;
        width: 320px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #drop-area {
        border: 1px dashed #4b5563;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #9ca3af;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        font-size: 13px;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Riven OCR</h1>
    <div id="drop-area">
      拖拽图片到这里，或点击选择
      <br />
      也支持在此窗口按 <b>Ctrl+V</b> 粘贴截图
      <input
        id="file-input"
        type="file"
        accept="image/*"
        style="display: none"
      />
    </div>
    <div id="status">未选择图片</div>
    <button id="fill-button" disabled>识别并写入 warframe.market</button>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
