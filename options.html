<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Riven OCR - 设置</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: #111827;
        color: #e5e7eb;
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 20px;
        color: #f3f4f6;
      }
      .section {
        background: #1f2937;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .section h2 {
        font-size: 16px;
        margin: 0 0 12px 0;
        color: #f9fafb;
      }
      .form-group {
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
        color: #d1d5db;
      }
      input[type="text"], input[type="url"] {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        background: #374151;
        color: #e5e7eb;
        font-size: 14px;
      }
      input[type="text"]:focus, input[type="url"]:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .checkbox-group input[type="checkbox"] {
        width: auto;
      }
      .status {
        margin-top: 8px;
        padding: 8px;
        border-radius: 4px;
        font-size: 13px;
      }
      .status.success {
        background: #065f46;
        color: #a7f3d0;
      }
      .status.error {
        background: #991b1b;
        color: #fca5a5;
      }
      .status.info {
        background: #1e3a8a;
        color: #bfdbfe;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        background: #2563eb;
        color: white;
        margin-right: 8px;
      }
      button:hover {
        background: #1d4ed8;
      }
      button.secondary {
        background: #6b7280;
      }
      button.secondary:hover {
        background: #4b5563;
      }
      .actions {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Riven OCR 设置</h1>

    <div class="section">
      <h2>后端服务配置</h2>
      <div class="form-group">
        <label for="backend-url">后端基础 URL</label>
        <input type="url" id="backend-url" placeholder="http://127.0.0.1:8000" />
      </div>
      <div id="backend-status" class="status info">正在检查后端状态...</div>
      <div class="actions">
        <button id="test-backend">测试连接</button>
        <button id="save-backend">保存配置</button>
      </div>
    </div>

    <div class="section">
      <h2>字典管理</h2>
      <div class="form-group">
        <label>当前字典版本</label>
        <div id="dict-version">未知</div>
      </div>
      <div id="dict-status" class="status info">正在检查字典状态...</div>
      <div class="actions">
        <button id="update-dict" class="secondary">更新字典</button>
      </div>
    </div>

    <div class="section">
      <h2>自动行为</h2>
      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="auto-fill-rows" />
          <label for="auto-fill-rows">自动补满正面词条行数</label>
        </div>
      </div>
      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="auto-open-modal" />
          <label for="auto-open-modal">自动打开拍卖模态框</label>
        </div>
      </div>
      <div class="actions">
        <button id="save-settings">保存设置</button>
      </div>
    </div>

    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
