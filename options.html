<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riven OCR - 设置</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-main: #ffffff;
        --bg-secondary: #f3f4f6;
        --text-main: #111827;
        --text-secondary: #4b5563;
        --border: #e5e7eb;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --radius: 12px;
      }

      [data-theme='dark'] {
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --bg-main: #111827;
        --bg-secondary: #1f2937;
        --text-main: #f9fafb;
        --text-secondary: #9ca3af;
        --border: #374151;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      body {
        margin: 0;
        padding: 40px 20px;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg-secondary);
        color: var(--text-main);
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: var(--bg-main);
        padding: 32px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }

      h1 {
        font-size: 24px;
        margin: 0 0 24px;
        font-weight: 700;
        text-align: center;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .settings-group {
        margin-bottom: 24px;
      }

      .settings-group h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin-bottom: 12px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }

      .setting-item {
        margin-bottom: 16px;
      }

      .setting-item label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
        font-weight: 500;
      }

      input[type="url"], input[type="text"], select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-main);
        color: var(--text-main);
        font-size: 14px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        padding: 8px 0;
      }

      .checkbox-item input {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-top: 8px;
      }

      .status-badge.success { background: #dcfce7; color: #166534; }
      .status-badge.error { background: #fee2e2; color: #991b1b; }
      .status-badge.info { background: #dbeafe; color: #1e40af; }

      [data-theme='dark'] .status-badge.success { background: #064e3b; color: #a7f3d0; }
      [data-theme='dark'] .status-badge.error { background: #7f1d1d; color: #fecaca; }
      [data-theme='dark'] .status-badge.info { background: #1e3a8a; color: #bfdbfe; }

      .btn-primary {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        margin-top: 12px;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Riven OCR 设置</h1>
      
      <div class="settings-group">
        <h2>后端服务</h2>
        <div class="setting-item">
          <label for="backend-url">OCR 后端 URL</label>
          <input type="url" id="backend-url" placeholder="http://127.0.0.1:80" />
          <div id="backend-status" class="status-badge info">检查中...</div>
        </div>
        <div class="setting-item">
          <label for="market-price-url">市场价格接口域名</label>
          <input type="url" id="market-price-url" placeholder="https://lab.webutilitykit.com" />
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="test-backend" style="flex: 1; padding: 8px; font-size: 12px; cursor: pointer;">测试连接</button>
          <button id="save-backend" style="flex: 1; padding: 8px; font-size: 12px; cursor: pointer;">保存</button>
        </div>
      </div>

      <div class="settings-group">
        <h2>字典管理</h2>
        <div class="setting-item">
          <div style="font-size: 13px; margin-bottom: 4px;">当前版本: <span id="dict-version" style="font-weight: 600;">-</span></div>
          <div id="dict-status" class="status-badge info">等待中</div>
        </div>
        <button id="update-dict" style="width: 100%; padding: 8px; font-size: 12px; cursor: pointer;">更新字典数据</button>
      </div>

      <div class="settings-group">
        <h2>自动化</h2>
        <label class="checkbox-item">
          <input type="checkbox" id="auto-fill-rows" />
          <span>自动补满正面词条行数</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="auto-open-modal" />
          <span>自动打开拍卖模态框</span>
        </label>
        
        <div class="setting-item" style="margin-top: 16px;">
          <label for="theme-select">外观主题</label>
          <select id="theme-select">
            <option value="system">跟随系统</option>
            <option value="light">浅色模式</option>
            <option value="dark">深色模式</option>
          </select>
        </div>
      </div>

      <div class="settings-group">
        <h2>关于作者</h2>
        <div class="setting-item">
          <div style="font-size: 13px; color: var(--text-secondary);">
            如有侵权或建议，请联系：<a href="mailto:yinb9933@gmail.com" style="color: var(--primary); text-decoration: none;">yinb9933@gmail.com</a>
          </div>
        </div>
      </div>

      <button id="save-settings" class="btn-primary">保存所有设置</button>
    </div>

    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
